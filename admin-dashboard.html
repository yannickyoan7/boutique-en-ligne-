<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord - SAMIRA</title>
  <style>
    :root {
      --brand: #8b5e45;
      --brand-dark: #704832;
      --brand-soft: #f2e7df;
      --page: #f7f3ef;
      --text: #302b28;
      --muted: #81766f;
      --line: #eee7e2;
      --white: #fff;
      --shadow: 0 8px 24px rgba(68, 46, 32, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--page);
      margin: 0;
      padding: 28px;
      color: var(--text);
    }

    .page-wrap {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 26px;
    }

    h1 {
      color: var(--brand-dark);
      font-size: 28px;
      margin: 0;
      letter-spacing: -0.5px;
    }

    h2 {
      color: var(--text);
      font-size: 20px;
      margin: 8px 0 4px;
    }

    button {
      background: var(--brand);
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background .2s ease, transform .2s ease, opacity .2s ease;
    }

    button:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
      transform: none;
    }

    #logout {
      background: #fff;
      color: var(--brand-dark);
      border: 1px solid #e6d8ce;
    }

    #logout:hover { background: var(--brand-soft); }

    .card {
      background: var(--white);
      padding: 26px;
      margin: 0;
      border: 1px solid rgba(139, 94, 69, .08);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 0 0 30px;
    }

    .stat-card {
      position: relative;
      background: #fff;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 3px 12px rgba(68, 46, 32, .035);
      min-height: 112px;
    }

    .stat-card h3 {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .55px;
    }

    .stat-card p {
      margin: 0;
      color: var(--brand-dark);
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 8px;
    }

    #message {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 950px;
      font-size: 13px;
    }

    thead th {
      background: #faf7f4;
      color: var(--brand-dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .45px;
      font-weight: 700;
      white-space: nowrap;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    th, td {
      padding: 15px 13px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line);
    }

    tbody tr:hover { background: #fdfbf9; }

    td:first-child {
      color: var(--brand-dark);
      font-weight: 700;
      max-width: 145px;
      overflow-wrap: anywhere;
    }

    select {
      display: block;
      width: 100%;
      min-width: 145px;
      margin: 0 0 8px;
      padding: 9px 30px 9px 10px;
      color: var(--text);
      background: #fff;
      border: 1px solid #e5dcd5;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
    }

    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(139, 94, 69, .12);
    }

    td:last-child {
      min-width: 205px;
    }

    td:last-child button {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      white-space: nowrap;
    }

    td:last-child button:last-child { margin-bottom: 0; }

    @media (max-width: 1000px) {
      body { padding: 20px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 20px; }
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      header { align-items: flex-start; }
      h1 { font-size: 23px; }
      #logout { padding: 10px 13px; }
      .card { padding: 15px; border-radius: 12px; }
      .stats { gap: 10px; margin-bottom: 24px; }
      .stat-card { padding: 15px; min-height: 100px; }
      .stat-card h3 { font-size: 10px; line-height: 1.4; }
      .stat-card p { font-size: 22px; }
      h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header>
      <h1>SAMIRA - Administration</h1>
      <button id="logout">Déconnexion</button>
    </header>

    <div class="card">
      <div class="stats">
        <div class="stat-card">
          <h3>Total des commandes</h3>
          <p id="totalOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>Chiffre d'affaires encaissé</h3>
          <p id="revenue">0 FCFA</p>
        </div>

        <div class="stat-card">
          <h3>Commandes payées</h3>
          <p id="paidOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>En attente de paiement</h3>
          <p id="pendingOrders">0</p>
        </div>
      </div>

      <div class="section-heading">
        <h2>Mes commandes</h2>
      </div>
      <p id="message">Chargement des commandes...</p>

      <table>
        <thead>
          <tr>
            <th>Référence</th>
            <th>Client</th>
            <th>Téléphone</th>
            <th>Montant</th>
            <th>Paiement</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersList"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://ouksbotecvbpwsgeapzs.supabase.co",
      "sb_publishable_wfY3c4mTOU85xmIrNyD5_g_tLUbUjlU"
    );

    async function loadOrders() {
      const message = document.getElementById("message");
      const ordersList = document.getElementById("ordersList");

      const { data: sessionData } =
        await supabaseClient.auth.getSession();

      if (!sessionData.session) {
        window.location.href = "/admin.html";
        return;
      }

      const { data, error } = await supabaseClient
        .from("orders")
        .select("id, customer_name, customer_phone, total, payment_status, order_status, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        message.textContent =
          "Impossible de charger les commandes : " + error.message;
        return;
      }

      message.textContent = data.length + " commande(s) trouvée(s).";

      // Calcul des statistiques
      const totalOrders = data.length;

      const paidOrders = data.filter(
        order => order.payment_status === "paid"
      ).length;

      const pendingOrders = data.filter(
        order => order.payment_status === "pending"
      ).length;

      const revenue = data
        .filter(order => order.payment_status === "paid")
        .reduce((sum, order) => sum + Number(order.total || 0), 0);

      // Affichage des statistiques
      document.getElementById("totalOrders").textContent = totalOrders;
      document.getElementById("paidOrders").textContent = paidOrders;
      document.getElementById("pendingOrders").textContent = pendingOrders;
      document.getElementById("revenue").textContent =
        revenue.toLocaleString("fr-FR") + " FCFA";

      ordersList.innerHTML = "";

      data.forEach(order => {
        const row = document.createElement("tr");

        const values = [
          order.id,
          order.customer_name,
          order.customer_phone,
          Number(order.total).toLocaleString("fr-FR") + " FCFA",
          order.payment_status,
          order.order_status,
          new Date(order.created_at).toLocaleDateString("fr-FR")
        ];

        values.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value ?? "";
          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");

        const statusSelect = document.createElement("select");
        statusSelect.innerHTML = `
          <option value="pending">En attente</option>
          <option value="confirmed">Confirmée</option>
          <option value="paid">Payée</option>
          <option value="shipped">Expédiée</option>
          <option value="delivered">Livrée</option>
        `;

        statusSelect.value = order.order_status || "pending";

        const paymentSelect = document.createElement("select");
        paymentSelect.innerHTML = `
          <option value="pending">Paiement en attente</option>
          <option value="paid">Paiement reçu</option>
          <option value="failed">Paiement refusé</option>
        `;

        paymentSelect.value = order.payment_status || "pending";

        const paymentButton = document.createElement("button");
        paymentButton.textContent = "Enregistrer paiement";

        paymentButton.addEventListener("click", async () => {
          paymentButton.disabled = true;

          const { error } = await supabaseClient
            .from("orders")
            .update(
              paymentSelect.value === "paid"
                ? { payment_status: "paid", order_status: "confirmed" }
                : { payment_status: paymentSelect.value }
            )
            .eq("id", order.id);

          if (error) {
            alert("Erreur paiement : " + error.message);
            paymentButton.disabled = false;
            return;
          }

          alert(
            paymentSelect.value === "paid"
              ? "Paiement enregistré et commande automatiquement confirmée !"
              : "Statut du paiement mis à jour !"
          );
          loadOrders();
        });

        actionCell.appendChild(paymentSelect);
        actionCell.appendChild(paymentButton);

        const updateButton = document.createElement("button");
        updateButton.textContent = "Enregistrer la commande";

        updateButton.addEventListener("click", async () => {
          updateButton.disabled = true;

          const { error } = await supabaseClient
            .from("orders")
            .update({ order_status: statusSelect.value })
            .eq("id", order.id);

          if (error) {
            alert("Erreur : " + error.message);
            updateButton.disabled = false;
            return;
          }

          alert("Statut de la commande mis à jour !");
          loadOrders();
        });

        actionCell.appendChild(statusSelect);
        actionCell.appendChild(updateButton);
        row.appendChild(actionCell);

        ordersList.appendChild(row);
      });
    }

    document.getElementById("logout")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "/admin.html";
      });

    loadOrders();
  </script>
</body>
</html>
